[project]
name = "auth-v1"
version = "0.1.0"
description = ""
authors = [
    { name = "Wonik Kim", email = "developer.wi.76@gmail.com" }
]
readme = "README.md"


[tool.poetry]
packages = [{ include = "auth", from = "src" },{ include = "util", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
