[project]
name = "auth-v1"
version = "0.1.0"
description = ""
authors = [
    { name = "Wonik Kim", email = "developer.wi.76@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"

[tool.poetry]
packages = [{ include = "auth", from = "src" }]

[tool.poetry.dependencies]
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
pyjwt = "^2.10.1"
server = { path = "../../libs/server", develop = true }
database = { path = "../../libs/database", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
