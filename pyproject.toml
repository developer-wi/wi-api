[project]
name = "wi-api"
version = "0.1.0"
description = ""
authors = [
    { name = "Wonik Kim", email = "developer.wi.76@gmail.com" }
]
readme = "README.md"


[tool.poetry]
package-mode = false

[tool.poetry.group.auth-v1.dependencies]
auth-v1 = { path = "api-v1/auth", develop = true }
serverlib = { path = "libs/server-lib", develop = true }
databaselib = { path = "libs/database-lib", develop = true }
[tool.poetry.group.auth-v1]
optional = true

[tool.poetry.group.blog-v1.dependencies]
blog-v1 = { path = "api-v1/blog", develop = true }
serverlib = { path = "libs/server-lib", develop = true }
databaselib = { path = "libs/database-lib", develop = true }
[tool.poetry.group.blog-v1]
optional = true

[tool.poetry.dependencies]
python = "^3.10"
black = "^25.1.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
